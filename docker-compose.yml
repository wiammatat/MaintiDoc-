# Services d'infrastructure de MaintiDoc.
# Les services applicatifs (api, ui, vlm, mcp_server) seront ajoutés aux étapes suivantes.
# Lancement : docker compose up -d

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["./volumes/qdrant:/qdrant/storage"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5433:5432"]   # 5433 côté hôte : le port 5432 peut être pris par un PostgreSQL local
    volumes: ["./volumes/postgres:/var/lib/postgresql/data"]

  # Stockage de fichiers compatible S3. Remplace MinIO, dont les images ne sont plus distribuées publiquement.
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["sh", "/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ["8333:8333"]
    volumes:
      - ./volumes/seaweedfs:/data
      - ./docker/seaweedfs-entrypoint.sh:/entrypoint.sh:ro

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["./volumes/mlflow:/mlflow"]
